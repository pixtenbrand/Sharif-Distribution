<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glitter Studio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#efe9da;--pn:#fbf7ec;--tx:#231d0f;--mu:#76694a;--ac:#a87310;--bd:#d9cfb5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0805;--pn:#15120a;--tx:#f3ead2;--mu:#a1957a;--ac:#f2c14e;--bd:#2f2818}}
:root[data-theme="dark"]{--bg:#0a0805;--pn:#15120a;--tx:#f3ead2;--mu:#a1957a;--ac:#f2c14e;--bd:#2f2818}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 "Gill Sans","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#050403}
canvas{display:block;touch-action:none;cursor:crosshair}
#hint{position:absolute;left:14px;top:12px;color:#d8c48a;opacity:.75;pointer-events:none;font-size:12px}
#pn{background:var(--pn);border-top:1px solid var(--bd);padding:10px 12px;max-height:46%;overflow-y:auto}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
button,.btn,select{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#150f02}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sw{width:24px;height:24px;padding:0;border-radius:50%}
#sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;margin-bottom:6px}
#sl label{display:flex;flex-direction:column;color:var(--mu);font-size:12px}
input[type=range]{width:100%;accent-color:var(--ac)}
label.chk{display:flex;gap:5px;align-items:center;color:var(--mu)}
input[type=text]{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:4px 8px;width:9em;letter-spacing:.04em}
#pm,#einfo{color:var(--mu);font-size:12px}
#erow button:disabled{opacity:.4;cursor:default}
</style></head><body>
<div id="stage"><canvas id="c"></canvas><div id="hint">Drag to paint glitter · Pen: click points, Enter to finish</div></div>
<div id="pn">
 <div class="row" id="tools">
  <button data-t="brush" class="on">Brush (drag)</button><button data-t="pen">Pen (click points)</button><button data-t="flare">Lens flare (drag)</button><button data-t="select">Select</button>
  <button id="fin">Finish path</button><button id="und">Undo</button><button id="rdo">Redo</button><button id="clr">Clear</button>
 </div>
 <div class="row">
  <select id="shape"><option value="wave">Wave</option><option value="circle">Circle</option><option value="star">Star</option><option value="heart">Heart</option><option value="spiral">Spiral</option></select>
  <button id="add">Add glittering shape</button>
  <label class="btn">Import SVG<input type="file" id="svg" accept=".svg,image/svg+xml" hidden></label>
 </div>
 <div class="row"><select id="pr" title="Look preset"></select><button id="fdust">Dust field</button><button id="ftex">Glitter texture</button><label class="chk">BG<input type="color" id="bgc" value="#0a0805"></label><button id="bgr">Default BG</button></div>
 <div class="row"><select id="fs" title="Flare style"></select><label class="chk"><input type="checkbox" id="he">Flare at stroke end</label>
  <select id="pkn" title="Pack size"><option>12</option><option selected>18</option><option>24</option></select><select id="pks" title="Pack type"><option>Stars</option><option>Lens</option><option>All</option></select><button id="pk">Generate pack</button><button id="zpk">Each element to PNG zip</button></div>
 <div class="row" id="vrow"><label class="chk">Seed<input type="text" id="mseed" spellcheck="false" autocomplete="off" title="Master seed: same seed + same settings = same pack"></label><button id="sgen">Generate seed</button><button id="scp">Copy seed</button><label class="chk"><input type="checkbox" id="slk">Lock seed</label><select id="uq" title="Uniqueness: how different each pack element must be"><option value="70">Uniqueness: Conservative</option><option value="55" selected>Uniqueness: Balanced</option><option value="45">Uniqueness: Strict</option><option value="35">Uniqueness: Extreme</option></select><span id="pm"></span></div>
 <div class="row" id="erow"><button id="eprv" title="Previous element">&#9664;</button><button id="enxt" title="Next element">&#9654;</button><span id="einfo">Select tool: click an element</span><button id="elck">Lock</button><button id="erg">Regenerate</button><button id="erd">Regenerate different</button><button id="edl">Delete</button></div>
 <div class="row" id="sw"></div>
 <div id="sl"></div>
 <div class="row"><label class="chk"><input type="checkbox" id="tw" checked>Twinkle</label><label class="chk"><input type="checkbox" id="fl">Fill closed shapes</label><label class="chk"><input type="checkbox" id="cm">Color mix</label><label class="chk"><input type="checkbox" id="all">Sliders edit all strokes</label></div>
 <div class="row"><button id="play">Play draw-on</button><label class="chk"><input type="checkbox" id="lp">Loop</label><select id="ln" title="Video length (Adobe: 5 to 60 s)"><option value="5">5 s</option><option value="10" selected>10 s</option><option value="15">15 s</option><option value="30">30 s</option><option value="60">60 s</option></select><select id="fps" title="Frame rate"><option value="30" selected>30 fps</option><option value="60">60 fps</option></select><button id="vid">Render MP4 video</button></div>
 <div class="row"><select id="res" title="Export size"><option value="3840" selected>4K (3840)</option><option value="7680">8K (7680)</option><option value="1920">Full HD</option></select><label class="chk"><input type="checkbox" id="tr" checked>Transparent</label><button id="png">PNG</button><button id="jpg">JPG</button><button id="xsvg">SVG</button><button id="psd">PSD layers (zip)</button><span id="st" style="color:var(--mu)"></span></div>
</div>
<script>
const $=s=>document.querySelector(s),C=$('#c'),STEP=3;let X=C.getContext('2d');const MX=X;
const P={amount:55,spread:26,size:1.6,glow:55,core:60,taper:1.2,twinkle:1,fill:0,drift:0,stars:1.2,bokeh:0,mode:0,halo:25,bsize:1,ssize:1,bright:1,mix:0};
const PG=P,SI={};let W,H,strokes=[],cur=null,tool='brush',pen=[],hov=null,raw=[],down=0,seed=1,dirty=1,col={h:'#ffc84a',rb:0};
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function fit(){const r=$('#stage').getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;C.width=W*d;C.height=H*d;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(d,0,0,d,0,0);dirty=1}
new ResizeObserver(fit).observe($('#stage'));
function chaikin(p,n){for(let k=0;k<n;k++){const q=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}q.push(p[p.length-1]);p=q}return p}
function resample(p,s){const o=[[p[0][0],p[0][1]]];let d=s;for(let i=1;i<p.length;i++){const[x0,y0]=p[i-1],[x1,y1]=p[i],L=Math.hypot(x1-x0,y1-y0);let t=0;while(L-t>=d){t+=d;o.push([x0+(x1-x0)*t/L,y0+(y1-y0)*t/L]);d=s}d-=L-t}return o}
function inside(p,x,y){let c=0;for(let i=0,j=p.length-1;i<p.length;j=i++){const[a,b]=p[i],[d,e]=p[j];if((b>y)!=(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c}return c}
const taper=(s,u)=>{const Q=s.P||P;return s.closed||Q.mode==4?1:Q.mode==1?Math.max(.08,Math.pow(u,1.6)):Math.max(.12,Math.pow(Math.sin(Math.PI*u),Q.taper))};
function build(p,o={}){
 let q=p.length>1?p:[p[0],[p[0][0]+.1,p[0][1]]];
 q=resample(chaikin(q,o.sm??3),STEP);const n=q.length;
 const nr=q.map((_,i)=>{const a=q[Math.max(0,i-1)],b=q[Math.min(n-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[-dy/l,dx/l]});
 const s={pts:q,nr,col:{...col},seed:o.seed??(Math.random()*1e9|0),closed:!!o.closed,parts:[],P:{...P}};if(P.mix&&!col.rb)s.pal=[sh(col.h,0),sh(col.h,.45),sh(col.h,-.3),sh(col.h,.8)];gen(s);return ensureEl(s)}
function gen(s){
 if(s.kind=='flare')return;if(s.kind=='field')return genField(s);
 const P=s.P;
 const n=s.pts.length,a=[],per=P.amount*STEP/10;
 for(let k=0;k<n;k++){
  const r=rng(s.seed+k*7919),u=k/(n-1||1),tp=taper(s,u),c=per*(.4+.6*tp);let m=Math.floor(c)+(r()<c%1?1:0);
  const[x,y]=s.pts[k],[nx,ny]=s.nr[k];
  while(m--){let o=(r()+r()+r()-1.5)*2*P.spread*tp,j=(r()-.5)*STEP*2;const M=P.mode;
   if(M==2)o=o*.35+Math.sin(k*.12+(m%2)*3.14)*P.spread*.8*tp;else if(M==3)o=((m%3)-1)*P.spread*.55*tp+o*.12;else if(M==4){o=(r()*2-1)*P.spread;j=(r()-.5)*P.spread*.9}else if(M==5)o*=1.7;
   if(r()<.1)o*=1+r()*2.5;const b=r();
   const q=r(),st=q<P.stars/100?1:q>1-P.bokeh/100?2:0;a.push([x+nx*o+ny*j,y+ny*o-nx*j,st==2?P.size*P.bsize*(4+r()*9):st==1?P.size*P.ssize*(1.2+r()*2.2):P.size*(.3+b*b*b*2.6),st==2?.2+.5*r():.25+.75*r(),r()*6.28,u,st])}}
 if(P.fill&&s.closed){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;s.pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const r=rng(s.seed^55),cnt=Math.min(9000,(x1-x0)*(y1-y0)*P.amount*.0012);
  for(let i=0;i<cnt;i++){const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0);if(inside(s.pts,x,y)){const b=r();a.push([x,y,P.size*(.3+b*b*b*2.6),.15+.6*r(),r()*6.28,r(),0])}}}
 s.parts=a}
function one(s,t,fr=1){
 if(s.kind=='flare')return flareDraw(s,t,fr);
 const P=s.P||PG;
 const[R,G,B]=rgb(s.col.h),n=s.pts.length,gl=P.glow/100,co=P.core/100,rb=s.col.rb;
 const mix=(m,a)=>rb?null:`rgba(${R+(255-R)*m|0},${G+(255-G)*m|0},${B+(255-B)*m|0},${a})`;
 X.lineCap='round';
 if(co>0&&n>1)for(const pass of[0,1])for(let i=1;i<n*fr;i++){
  const u=i/(n-1),tp=taper(s,u);X.beginPath();X.moveTo(s.pts[i-1][0],s.pts[i-1][1]);X.lineTo(s.pts[i][0],s.pts[i][1]);
  X.strokeStyle=rb?`hsla(${u*300|0},100%,${pass?85:60}%,${pass?.9*co:.1*co+.05*gl})`:pass?mix(NORMAL?.3:.65,.9*co):mix(0,.07*co+.05*gl);
  X.lineWidth=(pass?.8+co*1.6:4+gl*14)*tp;X.stroke()}
 const tw=PG.twinkle,ts=t*.004,base=mix(NORMAL?.08:.25,1),hal=rb||s.pal?null:mix(0,1),hz=P.halo/100;if(!rb)X.fillStyle=base;
 for(const[px,py,z,a,ph,u,st]of s.parts){if(u>fr)continue;const x=px+(P.drift?Math.sin(ts*.5+ph*3)*P.drift*a:0),y=py+(P.drift?Math.cos(ts*.4+ph*2)*P.drift*a:0);
  const al=a*P.bright*(tw?.5+.5*Math.sin(ts*(1+a)+ph):1);X.globalAlpha=Math.min(1,al);
  if(rb)X.fillStyle=`hsl(${(u*300+ph*20)|0},100%,72%)`;else if(s.pal)X.fillStyle=s.pal[(ph/6.2832*s.pal.length)|0];
  if(st==2){X.globalAlpha=Math.min(1,al*(ph>3.1?.2:.32));X.beginPath();X.arc(x,y,z,0,6.283);X.fill();if(ph>3.1){X.globalAlpha=Math.min(1,al*.6);X.lineWidth=1.2;X.strokeStyle=X.fillStyle;X.stroke()}continue}
  X.beginPath();X.arc(x,y,z,0,6.283);X.fill();
  if(hz&&(z>.9||st)){X.globalAlpha=Math.min(1,al*.22*hz);if(hal)X.fillStyle=hal;X.beginPath();X.arc(x,y,z*(2.5+3*hz),0,6.283);X.fill();if(hal)X.fillStyle=base}
  if(st==1&&al>.3){const L=z*(4+4*gl),q=L*.14;X.globalAlpha=al;X.beginPath();X.moveTo(x,y-L);X.lineTo(x+q,y-q);X.lineTo(x+L,y);X.lineTo(x+q,y+q);X.lineTo(x,y+L);X.lineTo(x-q,y+q);X.lineTo(x-L,y);X.lineTo(x-q,y-q);X.closePath();X.fill()}}
 X.globalAlpha=1}
let anim=null,E=0,NORMAL=0,busy=0,BGC=null,REC=0;
const total=()=>(Math.max(strokes.length,1)-1)*.7+1.8;
const frac=i=>{if(!anim)return 1;const f=Math.min(1,Math.max(0,(E-i*.7)/1.8));return 1-(1-f)*(1-f)};
function paint(t,bg=1,list){
 const cw=X.canvas.width,ch=X.canvas.height,T=X.getTransform();
 X.globalCompositeOperation='source-over';X.setTransform(1,0,0,1,0,0);
 if(bg){const g=X.createRadialGradient(cw*.7,0,0,cw*.7,0,Math.max(cw,ch));g.addColorStop(0,'#2b2210');g.addColorStop(.5,'#0a0805');g.addColorStop(1,'#030302');X.fillStyle=BGC||g;X.fillRect(0,0,cw,ch)}else X.clearRect(0,0,cw,ch);
 X.setTransform(T);X.globalCompositeOperation=NORMAL?'source-over':'lighter';
 (list||(cur?strokes.concat(cur):strokes)).forEach((s,i)=>one(s,t,frac(i)))}
function loop(t){requestAnimationFrame(loop);if(!(W>0&&H>0)||busy)return;
 if(anim){E=(t-anim.t0)/1000;if(E>total()+anim.hold){const f=anim.done;anim=null;f&&f()}}
 if(anim||P.twinkle||dirty){try{paint(t);overlay()}catch(e){console.error(e)}dirty=0}}
fit();requestAnimationFrame(loop);
const pos=e=>{const r=C.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const prev=()=>{cur=pen.length?build([...pen,hov],{seed}):null};
C.onpointerdown=e=>{if(e.button)return;const p=pos(e);
 if(tool=='brush'){down=1;raw=[p];seed=Math.random()*1e9|0;C.setPointerCapture(e.pointerId);hist();cur=build(raw,{seed})}
 else{if(!pen.length)seed=Math.random()*1e9|0;pen.push(p);hov=p;prev()}dirty=1;$('#hint').style.opacity=0};
C.onpointermove=e=>{const p=pos(e);
 if(tool=='brush'&&down){const l=raw[raw.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>2){raw.push(p);cur=build(raw,{seed})}}
 else if(tool=='pen'&&pen.length){hov=p;prev()}dirty=1};
C.onpointerup=()=>{if(down){down=0;if(raw.length>1)strokes.push(cur);cur=null;dirty=1}};
C.ondblclick=()=>{if(tool=='pen'){pen.pop();finish()}};
let UST=[],RST=[];
function hist(){UST.push(JSON.parse(JSON.stringify(strokes)));if(UST.length>40)UST.shift();RST=[]}
function undo(){if(!UST.length)return;RST.push(JSON.parse(JSON.stringify(strokes)));strokes=UST.pop();cur=null;dirty=1}
function redo(){if(!RST.length)return;UST.push(JSON.parse(JSON.stringify(strokes)));strokes=RST.pop();cur=null;dirty=1}
function finish(){if(pen.length>1){hist();strokes.push(build(pen,{seed}))}pen=[];cur=null;dirty=1}
addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('input[type=text]'))return;if(e.key=='Enter')finish();if(e.key=='Escape'){pen=[];cur=null;dirty=1}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='z'){e.preventDefault();e.shiftKey?redo():undo()}});
$('#fin').onclick=finish;$('#und').onclick=undo;$('#rdo').onclick=redo;$('#clr').onclick=()=>{if(strokes.length)hist();strokes=[];pen=[];cur=null;dirty=1};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;pen=[];cur=null;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x==b));dirty=1});
const SH={
 wave:()=>({p:Array.from({length:61},(_,i)=>{const t=i/60;return[W*(.1+.8*t),H*(.72-.45*Math.sin(Math.PI*t)+.12*t)]})}),
 circle:()=>{const r=Math.min(W,H)*.32;return{p:Array.from({length:81},(_,i)=>{const t=i/80*6.2832;return[W/2+r*Math.cos(t),H/2+r*Math.sin(t)]}),closed:1}},
 star:()=>{const r=Math.min(W,H)*.36;return{p:Array.from({length:11},(_,i)=>{const t=i*Math.PI/5-Math.PI/2,q=i%2?r*.42:r;return[W/2+q*Math.cos(t),H/2+q*Math.sin(t)]}),closed:1,sm:0}},
 heart:()=>{const k=Math.min(W,H)*.02;return{p:Array.from({length:101},(_,i)=>{const t=i/100*6.2832;return[W/2+16*k*Math.pow(Math.sin(t),3),H/2-k*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]}),closed:1}},
 spiral:()=>{const r=Math.min(W,H)*.4;return{p:Array.from({length:161},(_,i)=>{const t=i/160,a=t*6.2832*3;return[W/2+r*t*Math.cos(a),H/2+r*t*Math.sin(a)]})}}};
$('#add').onclick=()=>{hist();const s=SH[$('#shape').value]();strokes.push(build(s.p,{closed:s.closed,sm:s.sm}));dirty=1;$('#hint').style.opacity=0};
$('#svg').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 const box=document.createElement('div');box.style.cssText='position:absolute;left:-9999px;width:800px;height:800px';box.innerHTML=await f.text();document.body.appendChild(box);
 const L=[];
 box.querySelectorAll('path,circle,ellipse,rect,line,polyline,polygon').forEach(el=>{try{
  const len=el.getTotalLength(),m=el.getCTM(),svg=el.ownerSVGElement,n=Math.max(12,Math.min(500,len/3|0)),pts=[];
  for(let i=0;i<=n;i++){const q=el.getPointAtLength(len*i/n),pt=svg.createSVGPoint();pt.x=q.x;pt.y=q.y;const r=pt.matrixTransform(m);pts.push([r.x,r.y])}
  L.push({pts,cl:/^(circle|ellipse|rect|polygon)$/.test(el.tagName)||/z\s*$/i.test(el.getAttribute('d')||'')})}catch{}});
 box.remove();e.target.value='';if(!L.length)return;
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;L.forEach(l=>l.pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}));
 const sc=Math.min(W*.8/((x1-x0)||1),H*.8/((y1-y0)||1)),ox=W/2-(x0+x1)/2*sc,oy=H/2-(y0+y1)/2*sc;
 hist();L.slice(0,80).forEach(l=>strokes.push(build(l.pts.map(([x,y])=>[x*sc+ox,y*sc+oy]),{closed:l.cl,sm:l.cl?0:1})));
 dirty=1;$('#hint').style.opacity=0};
[['amount','Amount',0,100,1],['spread','Spread',2,90,1],['size','Particle size',.5,4,.1],['glow','Glow',0,100,1],['core','Core line',0,100,1],['taper','Taper',0,3,.1],['drift','Drift (motion)',0,30,1],['stars','Sparkle stars %',0,40,.5],['bokeh','Bokeh discs %',0,30,.5],['bsize','Bokeh size',.4,3,.1],['ssize','Star size',.4,3,.1],['halo','Particle glow',0,100,1],['bright','Particle brightness',.4,2,.05]].forEach(([k,n,a,b,st])=>{
 const l=document.createElement('label');l.textContent=n;const i=document.createElement('input');i.type='range';i.min=a;i.max=b;i.step=st;i.value=P[k];
 i.oninput=()=>{P[k]=+i.value;(document.getElementById('all').checked?strokes:strokes.filter(s=>s.P).slice(-1)).forEach(s=>{if(s.P&&!s.lock){s.P[k]=P[k];gen(s)}});dirty=1};SI[k]=i;l.append(i);$('#sl').append(l)});
$('#tw').onchange=e=>{P.twinkle=+e.target.checked;dirty=1};
$('#fl').onchange=e=>{P.fill=+e.target.checked;strokes.forEach(s=>{if(s.P&&!s.lock){s.P.fill=P.fill;gen(s)}});dirty=1};
['#ffc84a','#e6eeff','#ff8fb1','#6cc8ff','#8dffb0','#c99bff','rainbow'].forEach(h=>{
 const b=document.createElement('button');b.className='sw';b.title=h=='rainbow'?'Rainbow':h;b.style.background=h=='rainbow'?'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)':h;

const grp=(a,b,K)=>{let s=0,w=0;for(const[k,wt]of K){const x=(a[k]-b[k])/SIG;s+=wt*Math.exp(-x*x);w+=wt}return[s,w]};
function similarity(a,b){
 const fam=a.shapeFamily==b.shapeFamily?1:REL[a.shapeFamily+b.shapeFamily]?.4:0,
  sym=a.symmetry==b.symmetry?1:!a.symmetry||!b.symmetry?0:Math.exp(-(((a.symmetry-b.symmetry)/3)**2)),
  ray=Math.exp(-(((a.rayCount-b.rayCount)/5)**2)),[gs,gw]=grp(a,b,SIM_G),[ds,dw]=grp(a,b,SIM_D),[as,aw]=grp(a,b,SIM_A);
 const geo=(3*fam+1.2*sym+1.2*ray+gs)/(5.4+gw);
 return cl((SIM_W.geo*geo+SIM_W.dist*ds/dw+SIM_W.app*as/aw-SIM_FLOOR)/(1-SIM_FLOOR))}
function nearest(d,L){let m=0,w=null;for(const o of L){const s=similarity(d,o);if(s>m){m=s;w=o}}return{sim:m,d:w}}

// ============================================================
// MUTATION ENGINE
// Mutates structure (not just colour). Pushes parameters away from the clone it collided with.
// ============================================================
const MUT={LOW:{amt:.12,n:4,sym:.1,fam:0},MEDIUM:{amt:.22,n:7,sym:.25,fam:.06},HIGH:{amt:.35,n:11,sym:.45,fam:.22},EXTREME:{amt:.55,n:99,sym:.7,fam:.5}};
const MUT_KEYS=['aspectRatio','rayLength','rayWidth','elongation','density','particleDensity','particleSize','clusterAmount','irregularity','curvature','glow','core','halo','sparkleAmount','bokehAmount','complexity'];
const poolFams=types=>[...new Set(types.map(famOf))];
function mutate(d,lv,r,away,types,forceFam){const M=MUT[lv],m={...d},K=MUT_KEYS.slice();
 for(let i=K.length-1;i>0;i--){const j=r()*(i+1)|0;[K[i],K[j]]=[K[j],K[i]]}
 for(const k of K.slice(0,M.n)){const dir=away?Math.sign(m[k]-away[k])||(r()<.5?-1:1):r()<.5?-1:1;let v=m[k]+dir*M.amt*(.5+r()*.5)+(r()-.5)*M.amt*.3;
  if(v<0||v>1)v=m[k]-dir*M.amt*(.5+r()*.5);m[k]=cl(v)}
 m.rotation=(m.rotation+r()*M.amt)%1;
 m.rayCount=Math.round(m.rayCount+(r()*2-1)*M.amt*20);
 const fs=poolFams(types||FK).filter(f=>f!=d.shapeFamily);
 if(fs.length&&(forceFam||r()<M.fam)){m.shapeFamily=pick(r,fs);const ts=FAM[m.shapeFamily].filter(t=>!types||types.includes(t));m.structureType=pick(r,ts.length?ts:FAM[m.shapeFamily]);
  const A=ARC[m.shapeFamily];m.rayCount=A.rays[0]+r()*(A.rays[1]-A.rays[0]+1)|0;m.symmetry=pick(r,A.sym)}
 else if(r()<M.sym){const o=ARC[m.shapeFamily].sym.filter(s=>s!=d.symmetry);if(o.length)m.symmetry=pick(r,o)}
 m.seed=hsh(d.seed,lv,r()*1e9|0);
 return fitFam(m,r)}
// Test -> reject -> mutate -> retest, with a hard attempt cap (no infinite loops)
const MAXA=80;
function uniqueDNA(key,d,others,thr,types,S,away,awayThr){
 for(let a=0;a<MAXA;a++){S.attempts++;
  const nn=nearest(d,others),as=away?similarity(d,away):0;
  if(nn.sim<thr&&(!away||as<awayThr)){S.accepted++;S.simSum+=nn.sim;return{dna:d,sim:nn.sim}}
  S.rejected++;S.mutations++;
  const ref=away&&as>=awayThr&&as>=nn.sim?away:nn.d;
  d=mutate(d,a<8?'LOW':a<20?'MEDIUM':a<45?'HIGH':'EXTREME',rng(hsh(key,'m',a)),ref,types,away&&a==0)}
 return null}

// ============================================================
// PACK GENERATOR
// ============================================================
const PACKS={Stars:['Classic star','Starburst','Ring halo','Slim cross','Sparkle cluster','Diagonal glint'],Lens:['Lens ghosts','Anamorphic streak','Soft orb','Sparkle burst','Ring halo','Diagonal glint'],All:FK};
let STATS=null;
const newStats=()=>({accepted:0,rejected:0,mutations:0,attempts:0,simSum:0,failed:0});
function grid(n){const cols=Math.ceil(Math.sqrt(n*W/H)),rows=Math.ceil(n/cols),cw=W/cols,ch=H/rows;
 return{r:Math.min(cw,ch)*.36,pos:i=>[(i%cols+.5)*cw,(Math.floor(i/cols)+.5)*ch],cell:(x,y)=>cl(y/ch|0,0,rows-1)*cols+cl(x/cw|0,0,cols-1)}}
function makeEl(d,p,r0,pool,id){const T=dnaT(d),r=r0*(.8+d.scale*.4),m=r*T.ext;
 return{kind:'flare',id:id||nid(),pk:1,dv:1,lock:0,pool,base:r0,dna:d,pts:[],nr:[],parts:[],col:{h:tintOf(d),rb:0},seed:d.seed,closed:0,
  geo:{x:p[0],y:p[1],r,type:d.structureType,rot:d.rotation*6.2832},box:[p[0]-m,p[1]-m,p[0]+m,p[1]+m]}}
function packSim(){const L=strokes.filter(s=>s.pk).map(s=>s.dna);let t=0,c=0,mx=0;
 for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const v=similarity(L[i],L[j]);t+=v;c++;mx=Math.max(mx,v)}return{avg:c?t/c:0,max:mx}}
function genPack(){
 if(!(W>0&&H>0))return;
 strokes.forEach(ensureEl);
 if(!$('#slk').checked)setSeed(newSeed());else setSeed($('#mseed').value);
 const n=+$('#pkn').value,pt=$('#pks').value,types=PACKS[pt],thr=+$('#uq').value/100,ms=MSEED,G=grid(n);
 hist();
 const locked=strokes.filter(s=>s.pk&&s.lock);strokes=strokes.filter(s=>!s.pk||s.lock);
 const used=new Set(locked.map(s=>G.cell(s.geo.x,s.geo.y))),free=[];for(let i=0;i<n;i++)if(!used.has(i))free.push(i);
 const acc=locked.map(s=>s.dna),o=rng(hsh(ms,'pack',n,pt))()*types.length|0,S=newStats(),t0=performance.now();
 for(const slot of free){
  if(performance.now()-t0>4000){S.failed++;continue}
  const key=[ms,n,pt,slot].join('/'),res=uniqueDNA(key,dnaNew(types[(slot+o)%types.length],hsh(key,'dna')),acc,thr,types,S);
  if(!res){S.failed++;continue}
  acc.push(res.dna);strokes.push(makeEl(res.dna,G.pos(slot),G.r,pt))}
 STATS=S;const Q=packSim(),made=S.accepted+locked.length;
 $('#pm').textContent=`${made}/${n} unique · ${S.rejected} rejected duplicates · ${S.mutations} mutations · ${S.attempts} tests · avg similarity ${Math.round(Q.avg*100)}%`+(locked.length?` · ${locked.length} locked kept`:'');
 st(S.failed?`Only ${made}/${n} unique elements at this uniqueness level. Try a lower level, a smaller pack, or pack type "All".`:`${made} unique elements generated · seed ${ms}`);
 dirty=1;updEl()}
$('#pk').onclick=genPack;
setSeed(newSeed());
$('#sgen').onclick=()=>{setSeed(newSeed());st('New seed '+MSEED)};
$('#mseed').onchange=()=>{setSeed($('#mseed').value);$('#slk').checked=true;st('Seed locked: '+MSEED)};
$('#scp').onclick=async()=>{try{await navigator.clipboard.writeText(MSEED);st('Seed copied: '+MSEED)}catch{const i=$('#mseed');i.select();try{document.execCommand('copy');st('Seed copied: '+MSEED)}catch{st('Copy failed, select the seed field manually')}}};

// ============================================================
// ELEMENT CONTROLS
// Select tool picks an element; Lock / Regenerate / Regenerate different / Delete act on it.
// ============================================================
let SEL=0;
const selEl=()=>strokes.find(s=>s.id==SEL);
function elBox(s){if(s.kind=='flare'){const{x,y,r}=s.geo;return[x-r*1.1,y-r*1.1,x+r*1.1,y+r*1.1]}const B=bbox([s]);return[B.x0,B.y0,B.x1,B.y1]}
function pickAt([x,y]){let f=null;
 for(let i=strokes.length-1;i>=0;i--){const s=strokes[i];
  if(s.kind=='flare'){if(Math.hypot(x-s.geo.x,y-s.geo.y)<s.geo.r*1.1)return s}
  else if(s.kind=='field')f=f||s;
  else{const tol=Math.max(10,(s.P||P).spread);for(const p of s.pts)if(Math.abs(p[0]-x)<tol&&Math.abs(p[1]-y)<tol)return s}}
 return f}
function overlay(){if(anim||REC||busy||X!==MX)return;const L=strokes.filter(s=>s.lock||s.id==SEL);if(!L.length)return;
 X.save();X.globalCompositeOperation='source-over';X.globalAlpha=1;
 for(const s of L){const[a,b,c,d]=elBox(s);
  if(s.id==SEL){X.setLineDash([5,4]);X.strokeStyle='rgba(242,193,78,.9)';X.lineWidth=1.2;X.strokeRect(a,b,c-a,d-b);X.setLineDash([])}
  if(s.lock){const px=a+4,py=b+4;X.fillStyle='rgba(10,8,5,.75)';X.fillRect(px-2,py-2,15,17);X.strokeStyle=X.fillStyle='#f2c14e';X.lineWidth=1.6;
   X.beginPath();X.arc(px+5.5,py+6,3.5,Math.PI,0);X.stroke();X.fillRect(px+1,py+6,9,7)}}
 X.restore()}
function updEl(){const s=selEl(),on=!!s,fl=on&&s.kind=='flare';
 ['#elck','#edl'].forEach(q=>$(q).disabled=!on);['#erg'].forEach(q=>$(q).disabled=!on||s.kind=='field');$('#erd').disabled=!fl;
 $('#elck').textContent=on&&s.lock?'Unlock':'Lock';
 if(!on){$('#einfo').textContent=strokes.length?'Select tool: click an element':'No elements yet';return}
 ensureEl(s);const d=s.kind=='flare'||s.kind=='field'?s.dna:(s.dna=dnaFromStroke(s)),i=strokes.indexOf(s)+1;
 let t=`#${i}/${strokes.length} · ${d.shapeFamily} · ${d.structureType}`;
 if(s.kind=='flare')t+=` · ${d.symmetry?d.symmetry+'-fold':'free'} · ${d.rayCount} rays`;
 if(s.pk){const nn=nearest(d,strokes.filter(o=>o.pk&&o!==s).map(o=>o.dna));t+=` · nearest ${Math.round(nn.sim*100)}%`}
 $('#einfo').textContent=t+(s.lock?' · locked':'')}
function select(s){SEL=s?s.id:0;updEl();dirty=1}
function stepSel(k){if(!strokes.length)return;const i=strokes.indexOf(selEl());select(strokes[(i<0?(k>0?0:strokes.length-1):(i+k+strokes.length)%strokes.length)])}
function lockEl(){const s=selEl();if(!s)return;s.lock=s.lock?0:1;st(s.lock?'Locked: pack regeneration will keep it':'Unlocked');updEl();dirty=1}
function delEl(){const s=selEl();if(!s)return;if(s.lock)return st('Element is locked. Unlock it first.');hist();strokes=strokes.filter(o=>o!==s);SEL=0;updEl();dirty=1}
let RGN=0;
function regenEl(diff){const s=selEl();if(!s)return st('Select an element first (Select tool)');if(s.lock)return st('Element is locked. Unlock it to regenerate.');
 ensureEl(s);
 if(s.kind!='flare'){if(s.kind=='field')return;hist();const i=strokes.indexOf(s),n={...s,seed:hsh(MSEED,'stroke',s.id,++RGN)};gen(n);n.dna=dnaFromStroke(n);strokes[i]=n;dirty=1;updEl();return st('Stroke regenerated')}
 const types=PACKS[s.pool]||FK,thr=+$('#uq').value/100,key=[MSEED,'regen',s.id,++RGN,diff?'D':'R'].join('/'),S=newStats(),cur=s.dna,
  others=strokes.filter(o=>o!==s&&o.kind=='flare'&&o.pk).map(o=>ensureEl(o).dna),
  first=diff?mutate(cur,'EXTREME',rng(hsh(key,'first')),cur,types,1):dnaNew(pick(rng(hsh(key,'type')),types),hsh(key,'dna')),
  res=uniqueDNA(key,first,others,thr,types,S,cur,diff?Math.min(.3,thr*.6):thr);
 if(!res)return st('Could not find a unique variation in '+MAXA+' tries. Try a lower uniqueness level.');
 hist();const i=strokes.indexOf(s),base=s.base||s.geo.r;
 strokes[i]=makeEl(res.dna,[s.geo.x,s.geo.y],base,s.pool||'All',s.id);if(!s.pk)strokes[i].col={...s.col};
 st(`Regenerated${diff?' (different)':''} · ${Math.round(similarity(res.dna,cur)*100)}% like before · ${S.rejected} rejected`);dirty=1;updEl()}
$('#elck').onclick=lockEl;$('#edl').onclick=delEl;$('#erg').onclick=()=>regenEl(0);$('#erd').onclick=()=>regenEl(1);$('#eprv').onclick=()=>stepSel(-1);$('#enxt').onclick=()=>stepSel(1);
{const od=C.onpointerdown;C.onpointerdown=e=>{if(tool=='select'){if(!e.button){select(pickAt(pos(e)));$('#hint').style.opacity=0}return}od(e)}}
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{C.style.cursor=tool=='select'?'pointer':'crosshair'}));
addEventListener('keydown',e=>{if(tool!='select'||e.target.matches&&e.target.matches('input[type=text]'))return;
 if(e.key=='Delete'||e.key=='Backspace'){e.preventDefault();delEl()}else if(e.key.toLowerCase()=='l')lockEl();else if(e.key=='ArrowRight')stepSel(1);else if(e.key=='ArrowLeft')stepSel(-1)});
// keep the element panel in sync after undo/redo/clear
['#und','#rdo','#clr'].forEach(q=>$(q).addEventListener('click',()=>setTimeout(updEl)));addEventListener('keydown',()=>setTimeout(updEl));
updEl();
</script></body></html>
